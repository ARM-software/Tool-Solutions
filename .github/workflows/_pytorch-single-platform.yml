name: "PyTorch single platform build-and-test"

on:
  workflow_call:
    inputs:
      target_name:
        required: true
        type: string
      runner_label:
        required: true
        type: string
      onednn_fpmath_modes_json:
        required: true
        type: string

# Declare default permissions as read only.
permissions: read-all

jobs:
  build-wheel:
    runs-on: ${{ inputs.runner_label }}
    env:
      TARGET_NAME: ${{ inputs.target_name }}
      CCACHE_LOCAL_DIR: ${{ github.workspace }}/Tool-Solutions/ML-Frameworks/pytorch-aarch64/.ccache
      BUILDER_IMAGE_NAME: local/pytorch-manylinux2_28_aarch64-builder:cpu-aarch64
    steps:
      - name: Checkout Tool-Solutions
        uses: actions/checkout@v7.0.1
        with:
          path: Tool-Solutions

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.5.0

      - name: Create unique cache key from the year and week (YYYY-WW)
        id: cache_suffix
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Restore cache if available. GitHub automatically evicts cache entries that have not been
      # accessed for over 7 days. We rotate the cache key weekly; if no cache exists for the
      # current week, a cache from a previous week (via the prefix restore key) will be restored
      # and then saved under the current week's key at the end of the job. This effectively limits
      # the cache to at most two weeks of cache data.
      - name: Restore ccache cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CCACHE_LOCAL_DIR }}
          key: ccache-${{ env.TARGET_NAME }}-${{ steps.cache_suffix.outputs.week }}
          restore-keys: |
            ccache-${{ env.TARGET_NAME }}-

      - name: Build PyTorch wheel
        working-directory: ${{ github.workspace }}/Tool-Solutions/ML-Frameworks/pytorch-aarch64
        run: ./build.sh --wheel-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_LOCAL_DIR: ${{ env.CCACHE_LOCAL_DIR }}
          CCACHE_MAXSIZE: 2G

      - name: Print ccache disk usage
        run: du -sh "${{ env.CCACHE_LOCAL_DIR }}" || true

      - name: Report final ccache build stats
        run: |
          docker run --rm \
            -e CCACHE_DIR=/.ccache \
            -v "${CCACHE_LOCAL_DIR}:/.ccache" \
            "${BUILDER_IMAGE_NAME}" \
            ccache -s || true

      - name: Upload PyTorch wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          name: toolsolutions-pytorch-wheel-${{ env.TARGET_NAME }}
          path: Tool-Solutions/ML-Frameworks/pytorch-aarch64/results/torch-*-manylinux*_aarch64.whl
          if-no-files-found: error
          compression-level: 0 # Wheels are already compressed.
          retention-days: 3

  test:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        onednn_fpmath_mode: ${{ fromJSON(inputs.onednn_fpmath_modes_json) }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Checkout Tool-Solutions
        uses: actions/checkout@v7.0.1
        with:
          path: Tool-Solutions

      - name: Download PyTorch wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: toolsolutions-pytorch-wheel-${{ inputs.target_name }}
          path: Tool-Solutions/ML-Frameworks/pytorch-aarch64/results

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.5.0

      - name: Build PyTorch test image
        id: build-image
        working-directory: ${{ github.workspace }}/Tool-Solutions/ML-Frameworks/pytorch-aarch64
        run: |
          ./get-source.sh
          ./dockerize.sh results/torch-*-manylinux*_aarch64.whl --build-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke tests
        run: |
          docker run --rm \
            -e ONEDNN_DEFAULT_FPMATH_MODE=${{ matrix.onednn_fpmath_mode }} \
            toolsolutions-pytorch:latest ./test-examples.sh

      - name: Run unit tests
        # Run after smoke-test failures, provided the image built successfully.
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          docker run --rm \
            -e ONEDNN_DEFAULT_FPMATH_MODE=${{ matrix.onednn_fpmath_mode }} \
            toolsolutions-pytorch:latest ./run-unit-tests.sh
