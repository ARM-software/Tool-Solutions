name: "Build and test Tensorflow"

#* To avoid duplicate jobs running when both push and PR is satisfied, we use this:
#* https://github.com/orgs/community/discussions/26940#discussioncomment-5686753
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "ML-Frameworks/tensorflow-aarch64/**"
      - "ML-Frameworks/utils/**"
      # Exclusions (must come after the includes):
      - "!ML-Frameworks/tensorflow-aarch64/CHANGELOG.md"
      - "!ML-Frameworks/tensorflow-aarch64/README.md"
      - "!ML-Frameworks/tensorflow-aarch64/welcome.txt"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/**"
      - "ML-Frameworks/tensorflow-aarch64/**"
      - "ML-Frameworks/utils/**"
      # Exclusions (must come after the includes):
      - "!ML-Frameworks/tensorflow-aarch64/CHANGELOG.md"
      - "!ML-Frameworks/tensorflow-aarch64/README.md"
      - "!ML-Frameworks/tensorflow-aarch64/welcome.txt"
  schedule:
    #* minute (0-59) hour (0-23) day (1-31) month (1-12)  day of the week (0 - 6)
    #* cron jobs run on the default (main) branch.
    #* set to run at 5am UCT
    - cron: "0 5 * * *"
  #* allow manual trigger of workflow when needed.
  workflow_dispatch:

#* Stop stale workflows when pull requests are updated: https://stackoverflow.com/a/70972844
#* Does not apply to the main branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare default permissions as read only.
permissions: read-all

jobs:
  build-wheel:
    strategy:
      matrix:
        config: [
          { name: c7g, label: ah-ubuntu_24_04-c7g_8x-100 } # Metal instance required as 4x large is not big enough
        ]

    runs-on: ${{ matrix.config.label }}
    steps:
      - name: Checkout Tool-Solutions
        uses: actions/checkout@v7.0.1
        with:
          path: Tool-Solutions

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.5.0

      - name: Build TensorFlow wheel
        working-directory: ${{ github.workspace }}/Tool-Solutions/ML-Frameworks/tensorflow-aarch64
        run: ./build.sh --wheel-only

      - name: Upload TensorFlow wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tensorflow-wheel-${{ matrix.config.name }}
          path: Tool-Solutions/ML-Frameworks/tensorflow-aarch64/results/*.whl
          if-no-files-found: error
          compression-level: 0 # Wheels are already compressed.
          retention-days: 3

  test:
    needs: build-wheel
    strategy:
      matrix:
        config: [
          { name: c7g, label: ah-ubuntu_24_04-c7g_8x-100 }
        ]

    runs-on: ${{ matrix.config.label }}
    steps:
      - name: Checkout Tool-Solutions
        uses: actions/checkout@v7.0.1
        with:
          path: Tool-Solutions

      - name: Download TensorFlow wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: tensorflow-wheel-${{ matrix.config.name }}
          path: Tool-Solutions/ML-Frameworks/tensorflow-aarch64/results

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.5.0

      - name: Build TensorFlow test image
        id: build-image
        working-directory: ${{ github.workspace }}/Tool-Solutions/ML-Frameworks/tensorflow-aarch64
        run: |
          # The image includes upstream sources used by the unit tests.
          ./get-source.sh
          ./dockerize.sh results/*.whl --build-only

      - name: Run smoke tests
        run: docker run --rm toolsolutions-tensorflow:latest ./test-examples.sh

      - name: Run unit tests
        # Run after smoke-test failures, provided the image built successfully.
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: docker run --rm toolsolutions-tensorflow:latest ./run-unit-tests.sh
